name: CI & Docker Hub Publish

on:
  push:
    branches:
      - master
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up environment variables
        run: cp .env.sample .env

      - name: Build and start Docker services
        run: docker compose up --build -d

      - name: Wait for web service container
        run: |
          echo "Waiting for web service to start..."
          until [ "$(docker inspect -f '{{.State.Running}}' amae_web 2>/dev/null)" = "true" ]; do
            sleep 2
          done

      - name: Run Linters
        run: docker compose exec -T web make run-check-linters

      - name: Run Pytest Test Suite
        run: docker compose exec -T web pytest

      - name: Stop Docker services
        if: always()
        run: docker compose down -v

  publish:
    name: Build & Push AMAE to Docker Hub
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: DOCKERHUB
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (Multi-platform)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/amae
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.prod
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Kubernetes Manifest Tag & Push to GitOps
        run: |
          sed -i "s|image: .*/amae:.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/amae:${{ steps.meta.outputs.version }}|g" k8s/amae.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/amae.yaml
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(gitops): update AMAE image tag to ${{ steps.meta.outputs.version }} [skip ci]" && git push origin HEAD)

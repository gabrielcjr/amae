services:
  db:
    image: postgres:18
    container_name: amae_db
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - amae_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build: .
    container_name: amae_web
    restart: unless-stopped
    command: bash -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=db
    depends_on:
      db:
        condition: service_healthy

  tailwind:
    image: node:24-slim
    container_name: amae_tailwind
    user: "node"
    working_dir: /app
    tty: true
    volumes:
      - .:/app
    command: sh -c "npm install && npm run dev:css"
    depends_on:
      - web

volumes:
  amae_postgres_data:

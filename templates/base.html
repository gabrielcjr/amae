{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AMAE{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
    <nav class="bg-white shadow">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="{% url 'home' %}" class="text-xl font-bold text-indigo-600">AMAE</a>
                    <div class="hidden sm:ml-8 sm:flex sm:space-x-4">
                        <a href="{% url 'missionary_list' %}" class="text-gray-700 hover:text-indigo-600 px-3 py-2 text-sm font-medium">Missionários</a>
                        <a href="{% url 'church_list' %}" class="text-gray-700 hover:text-indigo-600 px-3 py-2 text-sm font-medium">Igrejas</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-1">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            {% block content %}{% endblock %}
        </div>
    </main>

    <footer class="bg-white border-t mt-auto">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
            <p class="text-center text-sm text-gray-500">AMAE - Conectando igrejas com missionários por todo o Brasil</p>
        </div>
    </footer>

    {% block extra_scripts %}{% endblock %}
</body>
</html>

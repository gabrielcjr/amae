{% extends "base.html" %}
{% load i18n %}

{% block title %}{{ page.title }} - AMAE{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto">
    <div class="card-devotional overflow-hidden">
        <div class="section-header">
            <h1>{{ page.title }}</h1>
        </div>
        <div class="px-8 py-10">
            <div class="text-ink-3 text-lg leading-relaxed space-y-4">
                {{ page.content|linebreaks }}
            </div>
            <div class="mt-10 pt-6 border-t border-border flex items-center justify-between text-sm text-ink-4">
                <span>{% trans "Last updated" %}: {{ page.updated_at|date:"d/m/Y" }}</span>
                <a href="{% url 'home' %}" class="text-accent hover:text-accent-hover font-medium transition-colors">{% trans "Back to home" %}</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% extends "base.html" %}

{% block title %}{{ page.title }} - AMAE{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto">
    <div class="bg-white rounded-2xl shadow-lg overflow-hidden">
        <div class="relative bg-gradient-to-br from-indigo-600 via-indigo-700 to-indigo-900 px-8 py-14">
            <div class="absolute inset-0 opacity-10">
                <svg class="w-full h-full" viewBox="0 0 400 200" preserveAspectRatio="none">
                    <path d="M0,100 C80,40 160,160 240,80 C320,0 400,120 400,100 L400,200 L0,200 Z" fill="white" opacity="0.1"/>
                    <circle cx="50" cy="30" r="40" fill="white" opacity="0.05"/>
                    <circle cx="350" cy="60" r="60" fill="white" opacity="0.05"/>
                </svg>
            </div>
            <div class="relative">
                <h1 class="text-4xl font-bold text-white">{{ page.title }}</h1>
                <div class="mt-3 w-16 h-1 bg-indigo-300 rounded"></div>
            </div>
        </div>
        <div class="px-8 py-10">
            <div class="text-gray-700 text-lg leading-relaxed space-y-4">
                {{ page.content|linebreaks }}
            </div>
            <div class="mt-10 pt-6 border-t border-gray-100 flex items-center justify-between text-sm text-gray-400">
                <span>Última atualização: {{ page.updated_at|date:"d/m/Y" }}</span>
                <a href="{% url 'home' %}" class="text-indigo-600 hover:text-indigo-800 font-medium transition-colors">Voltar ao início</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
